defaults:
  ffmpeg_path: ffmpeg
  width: 640
  height: 480
  fps: 15
  reconnect_interval_sec: 3
  rtsp_transport: tcp

cameras:
  - id: entrance
    name: 进货区摄像头
    # Production RTSP example:
    # source_type: rtsp
    # source: rtsp://user:password@192.168.1.10:554/stream1
    #
    # Development default uses FFmpeg's test source so the UI can run without
    # physical cameras. Replace source/source_type/input_format for real inputs.
    source_type: test
    input_format: lavfi
    source: testsrc=size=640x480:rate=15

  - id: scale
    name: 秤面长焦摄像头
    # Windows USB camera example:
    # source_type: device
    # input_format: dshow
    # source: video=USB Camera
    #
    # Jetson/Linux USB camera example:
    # source_type: device
    # input_format: v4l2
    # source: /dev/video0
    source_type: test
    input_format: lavfi
    source: smptebars=size=640x480:rate=15
